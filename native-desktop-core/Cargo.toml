[package]
name = "native-desktop-core"
version = "0.1.0"
edition = "2021"
description = "Core logic for the native desktop pet — LLM state machine, search, TTS, config"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
url = "2"
futures-util = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
