[package]
name = "native-desktop"
version = "0.1.0"
edition = "2021"
description = "Native desktop pet application — QML shell + Rust core"

[dependencies]
native-desktop-core = { path = "../native-desktop-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
