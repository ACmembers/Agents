# Qt-specific linker flags — only applies to the native-desktop crate
# NOTE: Qt 6.8.3 MinGW is installed. For MSVC builds, install Qt MSVC variant.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-args=/LIBPATH:C:/Qt/6.8.3/msvc2022_64/lib"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-args=-LC:/Qt/6.8.3/mingw_64/lib"]
